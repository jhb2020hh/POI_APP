# Beispiel-VirtualHost fuer die POI-App auf einem Standard-Apache-Webserver.
# Erwartete Module: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite, mod_ssl, mod_headers
#   a2enmod proxy proxy_http proxy_wstunnel rewrite ssl headers   (Debian/Ubuntu)
#
# Backend (Fastify) laeuft als eigenstaendiger Node-Prozess auf 127.0.0.1:3001,
# z.B. via systemd-Service oder pm2 (siehe deploy/README-deployment.md).
# Frontend ist der statische Vite-Production-Build (packages/frontend/dist).

<VirtualHost *:80>
    ServerName bau-tracking.unternehmen.com
    # NF-402: HTTPS ist Pflicht -> alles auf 443 umleiten
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName bau-tracking.unternehmen.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/bau-tracking.unternehmen.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/bau-tracking.unternehmen.com/privkey.pem

    DocumentRoot /var/www/poi-app/frontend-dist

    <Directory /var/www/poi-app/frontend-dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # API-Aufrufe an das Node/Fastify-Backend weiterleiten (NF-401)
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:3001/api
    ProxyPassReverse /api http://127.0.0.1:3001/api

    # WebSocket-Verbindungen fuer Echtzeit-Updates (FA-403, ab WP11) an das Backend durchreichen.
    # mod_proxy_wstunnel muss geladen sein, sonst schlaegt der WS-Handshake fehl.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/?(.*)$ ws://127.0.0.1:3001/ws/$1 [P,L]

    # Alle uebrigen Pfade an die React-SPA weiterreichen (Client-seitiges Routing, falls spaeter genutzt)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_URI} !^/api
    RewriteCond %{REQUEST_URI} !^/ws
    RewriteRule ^ /index.html [L]

    ErrorLog  ${APACHE_LOG_DIR}/poi-app-error.log
    CustomLog ${APACHE_LOG_DIR}/poi-app-access.log combined
</VirtualHost>
